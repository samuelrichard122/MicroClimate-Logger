# This file is a blueprint that tells Docker how to download, configure, and link my server applications so they can run as isolated, lightweight packages called "containers."
# so instead of installing Mosquitto and InfluxDB directly on my laptop, I can run them in containers that are easy to start, stop, and remove without leaving a mess behind.

services: # This starts the section where we list the individual applications we want to run.
  mosquitto:
    image: eclipse-mosquitto:latest
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf # Maps custom Mosquitto configuration file

  influxdb: # High-performance time-series database optimized for storing sensor metrics
    image: influxdb:2.7
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment: # Default initialization credentials and database bucket parameters
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminpassword
      - DOCKER_INFLUXDB_INIT_ORG=env_data
      - DOCKER_INFLUXDB_INIT_BUCKET=microclimate
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-super-secret-permanent-token-12345
    volumes:
      - influxdb-data:/var/lib/influxdb2 # Stores physical database records on your Mac's drive

  telegraf: # Automated bridge agent routing MQTT telemetry directly to InfluxDB
    image: telegraf:1.28
    restart: unless-stopped
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    depends_on:
      - mosquitto
      - influxdb

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - influxdb

volumes:
  influxdb-data:
  grafana-data: